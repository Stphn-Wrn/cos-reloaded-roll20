name: Release CoS Reloaded for Roll20

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version increment type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Bump version
        id: bump_version
        run: |
          NEW_VERSION=$(npm version ${{ github.event.inputs.increment }} --no-git-tag-version)
          echo "new_version=${NEW_VERSION#v}" >> $GITHUB_OUTPUT

      - name: Commit and push version update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version to ${{ steps.bump_version.outputs.new_version }}"
          file_pattern: package.json package-lock.json

      - name: Build scripts
        run: |
          npm run build -- --lang en
          npm run build -- --lang fr

      - name: Check builds in the simulated sandbox
        run: |
          npm run simulate -- dist/cos-reloaded-roll20-en.js
          npm run simulate -- dist/cos-reloaded-roll20-fr.js

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.new_version }}
          name: Release v${{ steps.bump_version.outputs.new_version }}
          files: |
            dist/cos-reloaded-roll20-en.js
            dist/cos-reloaded-roll20-fr.js
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
